apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-svc
  namespace: microservices
spec:
  template:
    metadata:
      labels:
        region: asia-south1
        cluster: gke-mumbai
    spec:
      containers:
        - name: user-svc
          args:
            - "-text={\"service\":\"user\",\"region\":\"asia-south1\",\"cluster\":\"gke-mumbai\",\"status\":\"ok\"}"
            - "-listen=:8080"
