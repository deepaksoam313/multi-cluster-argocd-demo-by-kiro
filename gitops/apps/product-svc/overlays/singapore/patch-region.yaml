apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-svc
  namespace: microservices
spec:
  template:
    metadata:
      labels:
        region: asia-southeast1
        cluster: gke-singapore
    spec:
      containers:
        - name: product-svc
          args:
            - "-text={\"service\":\"product\",\"region\":\"asia-southeast1\",\"cluster\":\"gke-singapore\",\"status\":\"ok\"}"
            - "-listen=:8080"
