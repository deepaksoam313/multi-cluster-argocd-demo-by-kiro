apiVersion: v1
kind: Service
metadata:
  name: product-svc
  namespace: microservices
  labels:
    app: product-svc
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app: product-svc
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
